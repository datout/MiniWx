name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Build debug APK
        run: |
          chmod +x bootstrap-gradle.sh
          ./bootstrap-gradle.sh :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MiniWx-${VERSION}.apk"
          ls -lh "dist/MiniWx-${VERSION}.apk"
          sha256sum "dist/MiniWx-${VERSION}.apk" | tee "dist/MiniWx-${VERSION}.apk.sha256"

      - name: Write build summary
        shell: bash
        run: |
          echo "### MiniWx ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`MiniWx-${VERSION}.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **MiniWx-${VERSION}-apk**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "Release: **v${VERSION}** will be created/updated automatically after this build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniWx-${{ env.VERSION }}-apk
          path: |
            dist/MiniWx-${{ env.VERSION }}.apk
            dist/MiniWx-${{ env.VERSION }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: MiniWx ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/MiniWx-${{ env.VERSION }}.apk
            dist/MiniWx-${{ env.VERSION }}.apk.sha256
