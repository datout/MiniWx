name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Build debug APK
        run: |
          chmod +x bootstrap-gradle.sh
          ./bootstrap-gradle.sh :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Write build summary
        run: |
          echo "### MiniWx 0.5.0 build" >> "$GITHUB_STEP_SUMMARY"
          echo "APK generated successfully: `app/build/outputs/apk/debug/app-debug.apk`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artifact named **MiniWx-0.5.0-debug-apk** below this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MiniWx 0.5.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniWx-0.5.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
